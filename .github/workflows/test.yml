name: Catalogue tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

      - name: Run sample scenario
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run summary
          npm run build
      - name: Downloadable offline browser app
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-browser-node-${{ matrix.node }}
          path: dist/index.html
